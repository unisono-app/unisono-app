name: health-check

# 本番の /api/health を定期的に叩き、
#  (a) 稼働の簡易カナリア（失敗時に GitHub がメール通知）
#  (b) Supabase 無料枠の7日休止防止（DB アクティビティを発生させる）
# を兼ねる。分単位の稼働監視が必要なら別途 UptimeRobot 等を併用する。
#
# 注意: GitHub の schedule はリポジトリが約60日無活動だと自動停止し、
#       実行時刻にも遅延がある。7日休止に対しては十分な余裕がある。

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC (JST 09:00)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            "https://unisono-app.vercel.app/api/health?token=${HEALTH_CHECK_TOKEN}" \
            -o /dev/null
